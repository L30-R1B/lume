<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Lume mark</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172B46"/>
      <stop offset="1" stop-color="#09131F"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8C3"/>
      <stop offset="1" stop-color="#78A9FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="34" fill="url(#bg)"/>
  <path d="M27 88 48 67 62 79 91 47" fill="none" stroke="#35516B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M27 88 48 67 62 79 91 47" fill="none" stroke="url(#beam)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="92" cy="46" r="10" fill="#79E9CF" filter="url(#glow)"/>
  <circle cx="27" cy="88" r="4" fill="#90A9C1"/>
  <circle cx="48" cy="67" r="4" fill="#90A9C1"/>
  <circle cx="62" cy="79" r="4" fill="#90A9C1"/>
</svg>

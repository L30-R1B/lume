<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Lume — evidence-backed context for Codex</title>
  <desc id="desc">A luminous graph connects code, evidence, and Codex on a deep navy canvas.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B1625"/>
      <stop offset=".56" stop-color="#101E31"/>
      <stop offset="1" stop-color="#102B36"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8C3"/>
      <stop offset="1" stop-color="#78A9FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#182A40"/>
      <stop offset="1" stop-color="#122336"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#43D9B0" stop-opacity=".24"/>
      <stop offset="1" stop-color="#43D9B0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="906" cy="170" r="260" fill="url(#aura)"/>
  <path d="M675 45v270M800 45v270M925 45v270M1050 45v270M675 105h470M675 175h470M675 245h470" stroke="#9BB4C8" stroke-opacity=".075"/>

  <g transform="translate(72 64)">
    <rect width="60" height="60" rx="18" fill="#172B46" stroke="#29465E"/>
    <path d="m14 43 12-12 9 7 17-22" fill="none" stroke="#385871" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m14 43 12-12 9 7 17-22" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="52" cy="16" r="5" fill="#7AF0D1" filter="url(#softGlow)"/>
  </g>
  <text x="148" y="104" fill="#9AB1C8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3.5">LOCAL CONTEXT ENGINE FOR CODEX</text>
  <text x="72" y="188" fill="#F4F8FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="62" font-weight="720" letter-spacing="-2">The right context.</text>
  <text x="72" y="253" fill="#F4F8FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="62" font-weight="720" letter-spacing="-2">Less noise.</text>
  <text x="76" y="302" fill="#B0C3D4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Original evidence · bounded retrieval · verified work</text>

  <g transform="translate(700 92)">
    <rect x="0" y="37" width="126" height="120" rx="18" fill="url(#panel)" stroke="#30495F"/>
    <text x="18" y="64" fill="#8EA9BE" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" letter-spacing="1.2">SOURCE</text>
    <path d="M19 84h70M19 101h88M19 118h53" stroke="#86A3BA" stroke-opacity=".65" stroke-width="5" stroke-linecap="round"/>
    <circle cx="103" cy="135" r="5" fill="#6BE6C2"/>

    <path d="M127 96h50" fill="none" stroke="url(#line)" stroke-width="2.5"/>
    <circle cx="151" cy="96" r="4" fill="#77EBD0"/>

    <rect x="177" y="0" width="150" height="194" rx="20" fill="url(#panel)" stroke="#3B6673"/>
    <text x="198" y="31" fill="#8EA9BE" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" letter-spacing="1.2">EVIDENCE</text>
    <path d="M199 54h106M199 72h84M199 90h109M199 108h67" stroke="#7CA3AE" stroke-opacity=".72" stroke-width="5" stroke-linecap="round"/>
    <rect x="197" y="135" width="110" height="34" rx="10" fill="#193D42" stroke="#36736B"/>
    <text x="212" y="157" fill="#8DF0D5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">hash verified</text>
    <circle cx="327" cy="96" r="5" fill="#77EBD0"/>
    <path d="M327 96h48" fill="none" stroke="url(#line)" stroke-width="2.5"/>

    <rect x="375" y="37" width="126" height="120" rx="18" fill="url(#panel)" stroke="#30495F"/>
    <text x="396" y="64" fill="#8EA9BE" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" letter-spacing="1.2">CODEX</text>
    <path d="M397 85h76M397 103h62M397 121h72" stroke="#86A3BA" stroke-opacity=".65" stroke-width="5" stroke-linecap="round"/>
    <circle cx="477" cy="138" r="5" fill="#78A9FF" filter="url(#softGlow)"/>
  </g>
  <text x="700" y="326" fill="#8DA8BE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="1.6">LOCAL BY DEFAULT  ·  MEASURED IN PRACTICE</text>
</svg>
